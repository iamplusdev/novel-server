services:
  novel-server:
    build:
      context: .
      # 需要 Chrome 刮削时置 1，镜像内安装 Playwright（CDP 连宿主机 Chrome）
      args:
        INSTALL_BROWSER_DEPS: "1"
    image: novel-server:latest
    container_name: novel-server
    restart: unless-stopped
    # host 网络：可直达宿主机 tieron Chrome CDP（127.0.0.1:16002）
    # 注意：host 模式下 ports 不生效，服务监听 HOST:PORT
    network_mode: host
    environment:
      # 必改：对外访问地址（域名或局域网 IP）。
      # 管理端封面已用相对路径；此项仍影响 Legado 书源与绝对链接兜底。
      PUBLIC_BASE_URL: "http://192.168.1.100:7311"
      HOST: "0.0.0.0"
      # 后端 API
      PORT: "7312"
      # 前端入口（静态 + /api 反代）
      FRONTEND_PORT: "7311"
      NOVELS_DIR: "/app/novels"
      DATABASE_PATH: "/app/data/novels.db"
      COVERS_DIR: "/app/covers"
      # 可选：刮削/备份代理（默认直连，不读系统代理）
      # SCRAPER_PROXY: "http://127.0.0.1:7890"
      # WEBDAV_PROXY: "http://127.0.0.1:7890"
      # 浏览器兜底（Playwright CDP → fnOS tieron Chrome）
      SCRAPER_BROWSER_FALLBACK: "1"
      CDP_URL: "http://127.0.0.1:16002"
      CDP_READY_WAIT: "20"
      # 限制 glibc 多线程 arena 数，降低常驻内存碎片
      MALLOC_ARENA_MAX: "2"
    volumes:
      # 源 TXT、数据库、封面 持久化（宿主机目录，不进镜像）
      - ./novels:/app/novels
      - ./data:/app/data
      - ./covers:/app/covers
    # 容器健康检查（D4）
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7312/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
